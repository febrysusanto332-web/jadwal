name: Threads Auto Poster Cloud

on:
  schedule:
    # Berjalan otomatis setiap 15 menit di cloud GitHub
    - cron: '*/15 * * * *'
  # Memungkinkan untuk dijalankan secara manual kapan saja dari tab Actions
  workflow_dispatch:

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositori
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Jalankan Auto Poster
        run: node runner.js

      - name: Simpan Pembaruan Status ke Repositori
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --staged --quiet || (git commit -m "Auto-update queue status [skip ci]" && git push)
